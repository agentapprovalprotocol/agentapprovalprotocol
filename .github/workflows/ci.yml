name: Specification and website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: make api-lint
      - run: npm run build

  adapters:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o "$RUNNER_TEMP/aap" ./cmd/aap
      - run: node --test internal/plugins/plugins.test.mjs
      - run: node --test deployment/cli/*.test.mjs
      - run: sh -n deployment/cli/install.sh scripts/publish-release.sh
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish
