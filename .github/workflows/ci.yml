name: Specification and website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: make api-lint
      - run: npm run build

  adapters:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o "$RUNNER_TEMP/aap" ./cmd/aap
      - run: node --test internal/plugins/plugins.test.mjs
      - run: node --test deployment/cli/*.test.mjs
      - run: sh -n deployment/cli/install.sh scripts/publish-release.sh
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --no-extra crewai
      - run: uv run --all-extras --no-extra crewai pytest --timeout 60
      - run: uv run --extra crewai pytest --timeout 60 tests/test_crewai.py tests/test_gate.py
      - run: uv build

  typescript-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --workspace sdk/typescript --workspace sdk/typescript-ai-sdk --workspace sdk/typescript-mastra
      - run: npm run check --workspace sdk/typescript
      - run: npm test --workspace sdk/typescript
      - run: npm run build --workspace sdk/typescript
      # The AI SDK and Mastra need Node.js 22 or later.
      - if: matrix.node != 20
        run: npm run check --workspace sdk/typescript-ai-sdk
      - if: matrix.node != 20
        run: npm test --workspace sdk/typescript-ai-sdk
      - if: matrix.node != 20
        run: npm run build --workspace sdk/typescript-ai-sdk
      - if: matrix.node != 20
        run: npm run check --workspace sdk/typescript-mastra
      - if: matrix.node != 20
        run: npm test --workspace sdk/typescript-mastra
      - if: matrix.node != 20
        run: npm run build --workspace sdk/typescript-mastra
