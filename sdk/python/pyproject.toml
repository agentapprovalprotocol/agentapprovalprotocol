[project]
name = "agentapprovalprotocol"
version = "0.3.3"
description = "Put an AI agent's tool calls behind an Agent Approval Protocol (AAP) approval provider."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["ai", "agents", "approval", "human-in-the-loop", "aap"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://agentapprovalprotocol.io"
Source = "https://github.com/agentapprovalprotocol/agentapprovalprotocol"

[project.optional-dependencies]
claude-agent-sdk = ["claude-agent-sdk>=0.2.165"]
langgraph = [
    "langchain>=1.0",
    "langgraph>=1.0",
]
deep-agents = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "deepagents>=0.7.24 ; python_full_version >= '3.11'",
]
pydantic-ai = [
    "pydantic-ai-slim>=2.55 ; python_full_version >= '3.11'",
]
adk = [
    "google-adk>=2.11",
]
openai-agents = [
    "openai-agents>=0.23",
]
crewai = ["crewai>=1.15 ; python_full_version < '3.14'"]

[dependency-groups]
dev = [
    "deepagents>=0.7.24 ; python_full_version >= '3.11'",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentapprovalprotocol"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# CrewAI needs openai below 3 and the OpenAI Agents SDK needs openai 3, so
# the two extras resolve separately and cannot be installed together.
conflicts = [[{ extra = "crewai" }, { extra = "openai-agents" }]]
# chromadb (through crewai) allows onnxruntime releases without Python 3.10 wheels.
constraint-dependencies = ["onnxruntime<1.24 ; python_full_version < '3.11'"]
