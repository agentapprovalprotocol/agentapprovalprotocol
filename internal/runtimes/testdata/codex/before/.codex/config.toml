# Codex configuration
model = "gpt-5-codex"
approval_policy = "on-request"

[mcp_servers.github]
command = "github-mcp"
args = ["stdio"]

[mcp_servers.github.env]
GITHUB_TOKEN = "ghp_x"

[mcp_servers.remote]
url = "https://remote.example.com/mcp"

[mcp_servers.remote.http_headers]
Authorization = "Bearer r"

[mcp_servers.parked]
command = "parked-mcp"
enabled = false
