version: 2
project_name: aap

builds:
  - id: aap
    main: ./cmd/aap
    binary: aap
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags:
      - '-s -w -X main.version={{ .Version }}'

archives:
  - formats: [binary]
    name_template: 'aap-{{ .Os }}-{{ .Arch }}'

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  disable: true

# Artifacts are public on R2; the source repository can remain private.
release:
  disable: true
